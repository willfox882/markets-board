name: build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest :sandbox:test assembleDebug lintDebug :sandbox:sandboxJar :sandbox:screenshots
      - name: Name the release files (debug-signed APK, no release keystore) and checksum them
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/markets-board-${VERSION}-debug.apk"
          cp sandbox/build/libs/markets-board-sandbox.jar "dist/markets-board-sandbox-${VERSION}.jar"
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-windows-linux
          path: |
            sandbox/build/libs/markets-board-sandbox.jar
            sandbox/run-sandbox.bat
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: sandbox/build/screenshots/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
